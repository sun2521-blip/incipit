# Render Blueprint for the Incipit API: https://render.com/docs/blueprint-spec
# In Render: New > Blueprint, pick this repository, and fill in the two values it
# asks for. The web app deploys to Vercel instead; see docs/deployment.md.
services:
  - type: web
    name: incipit-api
    runtime: python
    plan: free
    branch: main
    rootDir: services/api
    # --frozen: install exactly what uv.lock says. --no-dev: no test or lint tools.
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # --proxy-headers lets the app see that visitors used https. uvicorn would
    # also take the visitor's address from the first X-Forwarded-For entry,
    # which anyone can fake, so the app works that out itself: CLIENT_IP_HEADER.
    startCommand: .venv/bin/uvicorn api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      # Cloudflare, in front of Render, sets this to the visitor's address.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      # Not X-Forwarded-For counting: Render adds its own entries after
      # Cloudflare's, and the last one changes on every request (measured Nov 3).
      - key: TRUSTED_PROXY_HOPS
        value: "0"
      # The web app's address, e.g. https://incipit.vercel.app (no trailing slash).
      - key: ALLOWED_ORIGINS
        sync: false
      # A fine-grained GitHub token with read-only access to public repositories.
      - key: GITHUB_TOKEN
        sync: false
