[project]
name = "api"
version = "0.1.0"
description = "API for the Incipit open-source contribution navigator"
readme = "README.md"
authors = [
    { name = "sun2521-blip", email = "sun171106.2521@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
